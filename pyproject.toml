[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlweaver"
version = "0.2.0"
description = "自进化 AI 爬虫 — URL → 提取 → AI 改写 → SEO 优化 → HTML 渲染 → 自检评分"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "CrawlWeaver Contributors"}
]
keywords = ["crawler", "seo", "content-extraction", "llm", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "requests",
    "beautifulsoup4",
    "Jinja2",
    "Markdown",
    "youtube-transcript-api>=1.0",
    "python-dotenv",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

# Flat project structure — all .py files at root, no src/ layout
[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
