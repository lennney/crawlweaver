services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ytfactory
      POSTGRES_USER: ytfactory
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytfactory -d ytfactory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
