[project]
name = "youtube-content-factory"
version = "0.1.0"
description = "AI Agent 驱动的 YouTube 视频内容生产全流程平台"
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.86,<0.88",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.14,<2.0",
    "yt-dlp>=2024.0",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.29",
    "python-dotenv>=1.0,<2.0",
    "tiktokapi>=7.0",
    "langid>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory*", "trending_aggregator*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
addopts = "--cov=trending_aggregator --cov=factory --cov-report=term-missing"
testpaths = ["tests"]
